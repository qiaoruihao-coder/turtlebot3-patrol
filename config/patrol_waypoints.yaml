# ============================================================
# TurtleBot3 自主巡检配置
# 坐标系: map（单位: 米；yaw 单位: 度）
# 说明:
#   - initial_pose: 机器人初始位姿（代码自动设置，无需在 RViz 手点）
#   - waypoints:    巡检目标点序列，机器人按顺序依次到达
# ============================================================

# 机器人生成点为默认 (-2.0, -0.5)；odom 锚定在 gazebo 世界原点，
# 实测 map = odom + (1.995, 0.514)，故生成点对应地图坐标 ≈ (0, 0)
initial_pose:
  x: 0.0
  y: 0.0
  yaw: 0.0

waypoints:
  # —— 目标点 1：右侧（柱阵以东）——
  - name: "wp1-右"
    x: 3.6
    y: 0.5
    yaw: 0.0

  # —— 目标点 2：下方（柱阵以南, 避开南墙膨胀区）——
  - name: "wp2-下"
    x: 2.0
    y: -1.4
    yaw: 0.0

  # —— 目标点 3：上方（柱阵以北）——
  - name: "wp3-上"
    x: 2.0
    y: 2.6
    yaw: 0.0

# 巡检行为（加分项）: 到达目标点后的动作
patrol_behavior:
  dwell_time: 3.0        # 到达后停留(秒)
  spin_rotation: true    # 是否原地旋转一周扫描
  spin_duration: 4.0     # 旋转一周时长(秒)
