# ============================================================
# TurtleBot3 自主巡检配置
# 坐标系: map（单位: 米；yaw 单位: 度）
# 说明:
#   - initial_pose: 机器人初始位姿（代码自动设置，无需在 RViz 手点）
#   - waypoints:    巡检目标点序列，机器人按顺序依次到达
# ============================================================

# 机器人生成点为默认 (-2.0, -0.5)；odom 锚定在 gazebo 世界原点，
# 实测 map = odom + (1.995, 0.514)，故生成点对应地图坐标 ≈ (0, 0)
initial_pose:
  x: 0.0
  y: 0.0
  yaw: 0.0

waypoints:
  # —— 目标点 1：左上角（贴顶墙，与起点有较大跨度）——
  - name: "wp1-左上"
    x: 0.8
    y: 2.3
    yaw: 0.0

  # —— 目标点 2：右下角（贴底墙，对角跨度最大）——
  - name: "wp2-右下"
    x: 3.2
    y: -1.2
    yaw: 0.0

  # —— 目标点 3：右墙边（路线穿越中央柱阵，需绕障）——
  - name: "wp3-右墙"
    x: 3.8
    y: 0.8
    yaw: 0.0
